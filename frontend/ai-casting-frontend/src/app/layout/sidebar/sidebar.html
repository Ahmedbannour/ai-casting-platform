<aside class="sidebar">

  <!-- Logo -->
  <div class="sidebar-logo">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="logo-text">AI Casting</span>
  </div>

  <!-- New search -->
  <button class="new-chat-btn" (click)="newChat()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    Nouvelle recherche
  </button>

  <!-- History -->
  <div class="sidebar-section">
    <div class="section-label">Recherches récentes</div>
    @for (item of history(); track item.id) {
      <button class="history-item" (click)="newChat()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <span>{{ item.query | slice:0:28 }}{{ item.query.length > 28 ? '...' : '' }}</span>
        <span class="history-count">{{ item.resultsCount }}</span>
      </button>
    }
    @if (history().length === 0) {
      <div class="empty-history">Aucune recherche</div>
    }
  </div>

  <!-- Spacer -->
  <div class="flex-1"></div>

  <!-- Nav links -->
  <div class="sidebar-nav">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <rect width="7" height="7" x="3" y="3" rx="1"/>
        <rect width="7" height="7" x="14" y="3" rx="1"/>
        <rect width="7" height="7" x="14" y="14" rx="1"/>
        <rect width="7" height="7" x="3" y="14" rx="1"/>
      </svg>
      Tableau de bord
    </a>
    <a routerLink="/chat" routerLinkActive="active" class="nav-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Recherche IA
    </a>
  </div>

  <!-- Bottom -->
  <div class="sidebar-bottom">
    <!-- Theme toggle -->
    <button class="theme-toggle" (click)="themeService.toggle()">
      @if (themeService.theme() === 'dark') {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41
                   M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        Mode clair
      } @else {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        Mode sombre
      }
    </button>

    <!-- Logout -->
    <button class="logout-btn" (click)="logout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Déconnexion
    </button>
  </div>

</aside>
