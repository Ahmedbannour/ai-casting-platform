<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="AI Casting · Décrivez le rôle, l'IA prépare la planche">
<style>
  .bg{fill:#15161C}
  .t{font-family:'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:800;fill:#F2F3F6}
  .s{font-family:'Inter','Segoe UI',Arial,sans-serif;fill:#A4A9B8}
  .j{fill:#F2C230}
  .ring{fill:none;stroke:#F2C230;stroke-width:14;stroke-linecap:round;stroke-dasharray:290;stroke-dashoffset:290;animation:draw 1.6s cubic-bezier(.6,.1,.2,1) .2s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .fade{opacity:0;animation:in .8s ease-out forwards}
  .d1{animation-delay:.6s}.d2{animation-delay:1s}.d3{animation-delay:1.4s}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .q{opacity:0;animation:cycle 12s infinite}
  .q2{animation-delay:4s}.q3{animation-delay:8s}
  @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
  .card{animation:float 6s ease-in-out infinite}
  .c2{animation-delay:-2s}.c3{animation-delay:-4s}
  @keyframes float{50%{transform:translateY(-10px)}}
  .scan{animation:scan 3s linear infinite}
  @keyframes scan{from{transform:translateX(-140px)}to{transform:translateX(140px)}}
  .dot{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style>
<rect class="bg" width="1200" height="360" rx="24"/>
<circle cx="1120" cy="-30" r="190" fill="none" stroke="#F2C230" stroke-opacity=".08" stroke-width="40"/>
<g transform="translate(70 70)">
  <circle class="ring" cx="46" cy="46" r="40" transform="rotate(-90 46 46)"/>
  <text class="t fade" x="118" y="68" font-size="58">AI Casting</text>
</g>
<text class="s fade d1" x="70" y="200" font-size="26">Décrivez le rôle en une phrase. L’IA prépare la planche.</text>
<g class="fade d2" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="20">
  <rect x="70" y="236" width="560" height="54" rx="27" fill="#22242E" stroke="#2E3140"/>
  <text x="96" y="270" fill="#F2C230">›</text>
  <g fill="#DADCE3">
    <text class="q" x="118" y="270">Actrice 25-35 ans à Tunis, parle anglais et danse</text>
    <text class="q q2" x="118" y="270">Père de famille, 45 ans, accent du Sud</text>
    <text class="q q3" x="118" y="270">Enfant de 10 ans pour une publicité, Sousse</text>
  </g>
  <rect class="dot" x="606" y="252" width="3" height="22" fill="#F2C230"/>
</g>
<text class="s fade d3" x="70" y="326" font-size="17">Spring Boot · Angular · PostgreSQL + pgvector · IA locale (Ollama) · 0 € de licences</text>
<g transform="translate(800 70)">
  <g class="card c3"><rect x="150" y="30" width="170" height="220" rx="18" fill="#22242E" stroke="#2E3140"/><rect x="166" y="46" width="138" height="110" rx="10" fill="#2C2F3B"/><rect x="166" y="172" width="90" height="14" rx="7" fill="#3A3D4C"/><rect x="166" y="196" width="120" height="10" rx="5" fill="#2E3140"/></g>
  <g class="card c2"><rect x="80" y="14" width="170" height="220" rx="18" fill="#262833" stroke="#3A3D4C"/><rect x="96" y="30" width="138" height="110" rx="10" fill="#31343F"/><rect x="96" y="156" width="100" height="14" rx="7" fill="#4A4D5C"/><rect x="96" y="180" width="130" height="10" rx="5" fill="#3A3D4C"/></g>
  <g class="card"><rect x="0" y="0" width="190" height="240" rx="20" fill="#2A2C37" stroke="#F2C230" stroke-width="2"/>
    <clipPath id="ph"><rect x="16" y="16" width="158" height="124" rx="12"/></clipPath>
    <rect x="16" y="16" width="158" height="124" rx="12" fill="#3A3D4C"/>
    <circle cx="95" cy="66" r="24" fill="#4A4D5C"/><path d="M55 140c4-28 20-40 40-40s36 12 40 40z" fill="#4A4D5C"/>
    <g clip-path="url(#ph)"><rect class="scan" x="80" y="16" width="30" height="124" fill="#F2C230" opacity=".25"/></g>
    <text x="16" y="170" font-family="Archivo,'Arial Narrow',Arial,sans-serif" font-weight="800" font-size="20" fill="#F2F3F6">Yasmine, 29 ans</text>
    <rect x="16" y="184" width="158" height="34" rx="9" fill="#33301F" stroke="#F2C230" stroke-opacity=".5"/>
    <text x="28" y="206" font-family="Inter,Arial,sans-serif" font-size="13" fill="#F2C230">L’IA suggère : retenir</text>
  </g>
</g>
</svg>
