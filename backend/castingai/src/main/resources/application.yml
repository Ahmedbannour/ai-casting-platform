spring:
  application:
    name: ai-casting-platform

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

#  ai:
#    openai:
#      api-key: "dummy-key"
#      chat:
#        options:
#          model: gpt-4o-mini
#    autoconfigure:
#      exclude:
#        - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration


  datasource:
    url: jdbc:postgresql://localhost:5432/casting_db
    username: casting_user
    password: casting_pass

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  elasticsearch:
    uris: http://localhost:9200

minio:
  url: http://localhost:9000
  access-key: minio_admin
  secret-key: minio_password
  bucket-name: casting-media

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

logging:
  level:
    root: INFO
    com.castingai: DEBUG
    org.springframework.security: DEBUG