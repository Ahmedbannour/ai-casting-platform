spring:
  application:
    name: ai-casting-platform

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

#  ai:
#    openai:
#      api-key: "dummy-key"
#      chat:
#        options:
#          model: gpt-4o-mini
#    autoconfigure:
#      exclude:
#        - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration


  # Spring AI (ajout Cellule IA, J1) — configurable par variables d'environnement
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.1
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/casting_db}
    username: ${DB_USER:casting_user}
    password: ${DB_PASSWORD:casting_pass}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  elasticsearch:
    uris: http://localhost:9200

# Échelle de l'IA locale — à adapter à la machine (mesure : infra/perf/bench-ia.ps1)
#   Niveau 1 · Éco      (processeur modeste)   : AI_MODEL=llama3.2:1b AI_EXPLAIN_COUNT=3 AI_MAX_TOKENS=250
#   Niveau 2 · Standard (processeur récent)    : AI_MODEL=llama3.2    AI_EXPLAIN_COUNT=3 AI_MAX_TOKENS=300
#   Niveau 3 · GPU      (carte NVIDIA >= 4 Go) : AI_MODEL=llama3.2    AI_EXPLAIN_COUNT=5 AI_MAX_TOKENS=450  (défaut)
casting:
  # Connexion avec Google / Facebook : identifiants à créer (gratuitement) par l'agence.
  # Laissés vides, les boutons n'apparaissent pas. Le secret Facebook ne quitte jamais le serveur.
  oauth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    facebook-app-id: ${FACEBOOK_APP_ID:}
    facebook-app-secret: ${FACEBOOK_APP_SECRET:}
  ai:
    model: ${AI_MODEL:${OLLAMA_CHAT_MODEL:llama3.2}}
    explain-count: ${AI_EXPLAIN_COUNT:5}
    max-tokens: ${AI_MAX_TOKENS:450}

minio:
  url: http://localhost:9000
  access-key: ${S3_ACCESS_KEY:minio_admin}
  secret-key: ${S3_SECRET_KEY:minio_password}
  bucket-name: casting-media

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

logging:
  level:
    root: INFO
    com.castingai: INFO
    org.springframework.security: INFO