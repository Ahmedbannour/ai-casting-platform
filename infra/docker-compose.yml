services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: casting-postgres
    environment:
      POSTGRES_DB: casting_db
      POSTGRES_USER: casting_user
      POSTGRES_PASSWORD: casting_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    profiles: ["extras"]   # non utilisé par le code : démarrer avec --profile extras
    image: redis:7-alpine
    container_name: casting-redis
    ports:
      - "6379:6379"

  rabbitmq:
    profiles: ["extras"]   # non utilisé par le code : démarrer avec --profile extras
    image: rabbitmq:3-management
    container_name: casting-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    # minio/minio n'existe plus sur Docker Hub (retiré en 2026) : Silo est un fork compatible MinIO, même API S3
    image: pgsty/silo:latest
    container_name: casting-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  elasticsearch:
    profiles: ["extras"]   # non utilisé par le code : démarrer avec --profile extras
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    container_name: casting-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  ollama:
    image: ollama/ollama:latest
    container_name: casting-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  ollama_data: